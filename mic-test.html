<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка микрофона</title>
<style>
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#FCC41A;color:#222;
       display:flex;flex-direction:column;align-items:center;padding:24px 16px;min-height:100vh;box-sizing:border-box}
  h1{font-size:22px;text-align:center;margin:8px 0 20px}
  #btn{width:150px;height:150px;border-radius:50%;border:none;background:#E41D2E;color:#fff;font-size:56px;
       box-shadow:0 6px 18px rgba(0,0,0,.25)}
  #btn.rec{animation:p 1s infinite}
  @keyframes p{50%{transform:scale(1.08)}}
  #st{margin:20px 0;font-size:18px;text-align:center;min-height:50px}
  audio{width:100%;max-width:360px;margin-top:8px}
  #info{margin-top:24px;font-size:12px;color:#555;word-break:break-all;max-width:360px}
</style>
</head>
<body>
<h1>🎤 Проверка микрофона в MAX</h1>
<button id="btn">🎤</button>
<div id="st">Нажми на кнопку и скажи пару слов.<br>Нажми ещё раз — остановить.</div>
<audio id="pl" controls hidden></audio>
<div id="info"></div>
<script>
const btn=document.getElementById('btn'),st=document.getElementById('st'),pl=document.getElementById('pl');
const info=document.getElementById('info');
info.textContent='getUserMedia: '+!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)+
  ' · MediaRecorder: '+(typeof MediaRecorder!=='undefined')+' · '+navigator.userAgent;
let rec=null,chunks=[],t0=0;
btn.onclick=async()=>{
  if(rec&&rec.state==='recording'){rec.stop();return;}
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];rec=new MediaRecorder(s);
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{
      s.getTracks().forEach(x=>x.stop());btn.classList.remove('rec');
      const b=new Blob(chunks,{type:rec.mimeType});
      pl.src=URL.createObjectURL(b);pl.hidden=false;
      st.innerHTML='✅ Записалось! '+((Date.now()-t0)/1000).toFixed(1)+' с, '+Math.round(b.size/1024)+' КБ ('+(rec.mimeType||'?')+
        ')<br>Нажми ▶ ниже — слышно себя?';
    };
    rec.start();t0=Date.now();btn.classList.add('rec');st.textContent='🔴 Идёт запись… говори';
  }catch(e){st.innerHTML='❌ Микрофон недоступен:<br>'+e.name+' — '+e.message;}
};
</script>
</body>
</html>
